# yolov8m_lca_light_v2.yaml
nc: 14
depth_multiple: 0.67
width_multiple: 0.70
max_channels: 640

backbone:
  - [-1, 1, Conv,     [64, 3, 2]]            # 0  P1/2

  - [-1, 1, ConvLCA,  [128, 3, 2]]           # 1  P2/4
  - [-1, 2, C2f,      [128, True]]           # 2
  - [-1, 1, LCA,      [128]]                 # 3  P2 reinforcement

  - [-1, 1, Conv,     [256, 3, 2]]           # 4  P3/8
  - [-1, 3, C2f,      [256, True]]           # 5
  - [-1, 1, LCA,      [256]]                 # 6  P3 reinforcement

  - [-1, 1, Conv,     [384, 3, 2]]           # 7  P4/16
  - [-1, 3, C2f,      [384, True]]           # 8

  - [-1, 1, Conv,     [512, 3, 2]]           # 9  P5/32
  - [-1, 1, C2f,      [512, True]]           # 10
  - [-1, 1, SPPF,     [512, 5]]              # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 12
  - [[-1, 8], 1, Concat, [1]]                    # 13
  - [-1, 1, C2f, [384, False]]                   # 14  P4 head

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15
  - [[-1, 6], 1, Concat, [1]]                    # 16
  - [-1, 1, C2f, [256, False]]                   # 17  P3 head

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 18
  - [[-1, 3], 1, Concat, [1]]                    # 19
  - [-1, 1, C2f, [128, False, ConvLCA]]          # 20  P2 head

  - [-1, 1, Conv, [128, 3, 2]]                   # 21  down to P3
  - [[-1, 17], 1, Concat, [1]]                   # 22
  - [-1, 1, C2f, [256, False]]                   # 23  P3 fused

  - [-1, 1, Conv, [256, 3, 2]]                   # 24  down to P4
  - [[-1, 14], 1, Concat, [1]]                   # 25
  - [-1, 1, C2f, [384, False]]                   # 26  P4 fused

  - [-1, 1, Conv, [384, 3, 2]]                   # 27  down to P5
  - [[-1, 11], 1, Concat, [1]]                   # 28
  - [-1, 1, C2f, [512, False]]                   # 29  P5 fused

  - [[23, 26, 29], 1, Detect_HailoFriendly, [nc]]  # 30 Detect(P3-P5)

